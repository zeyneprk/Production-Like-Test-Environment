name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ship-live:
    name: Live data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      # Live data, not the clone. .env.prod points at orders_clone and is
      # used only by the Clone pipeline workflow.
      - name: Ship order 3 against live data
        run: |
          set -euo pipefail
          DATABASE_URL=postgres://orders:orders@127.0.0.1:5433/orders_prodlike \
            PORT=3000 \
            node --import tsx src/index.ts > /tmp/api.log 2>&1 &

          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/customers >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "API did not start"
            cat /tmp/api.log
            exit 1
          fi

          code=$(curl -s -o /tmp/ship.json -w "%{http_code}" -X POST http://127.0.0.1:3000/orders/3/ship)
          echo "POST /orders/3/ship → HTTP $code"
          cat /tmp/ship.json
          echo
          if [ "$code" != "200" ]; then
            echo "Production crashed while shipping order 3. That live row has a NULL address."
            exit 1
          fi
