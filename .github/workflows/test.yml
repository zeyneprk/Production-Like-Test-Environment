name: Test environment

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  ship:
    name: Clean data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Rehearse writes against the clean database
        run: npm run test:test
